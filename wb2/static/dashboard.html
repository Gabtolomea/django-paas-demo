<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration</title>
    <link rel="stylesheet" type="text/css" href="sty.css">
    <style>
        body {
            background: #E6ECEB;
        }
    </style>
    <script src="https://kit.fontawesome.com/9658ee38ca.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="toggle-button">
            <div class="wrapper">
                <div class="menu-bar menu-bar-top"></div>
                <div class="menu-bar menu-bar-middle"></div>
                <div class="menu-bar menu-bar-bottom"></div>
            </div>
        </div>
        <div class="pl-4" style="padding-left: 100px;">
            <h1 style="color:#63CDD7"> ONLINE WATER BILLING STATION</h1>
        </div>
        <div class="notif">
            <i class="fa-solid fa-bell"></i>
        </div>
        <div class="search">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
        </div>
        <div class="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>
    </header>
    <div class="sidebar">
        <div class="developer">
            <i class="fa-solid fa-circle-user fa-8x"></i>
        </div>
        <div class="devword">
            <h3>Developer</h3>
        </div>
        <div class="billing">
            <i class="fa-solid fa-money-bill-wave fa-2x"></i>
        </div>
        <div class="billword">
            <h5>Billing</h5>
        </div>
        <div class="metereading">
            <i class="fa fa-tachometer fa-2x"></i>
        </div>
        <div class="meterword">
            <h5>MeterReading</h5>
        </div>
        <div class="useracc">
            <i class="fa-solid fa-user fa-2x"></i>
        </div>
        <div class="userword">
            <h5>UserAccounts</h5>
        </div>
        <div class="report">
            <i class="fa-solid fa-newspaper fa-2x"></i>
        </div>
        <div class="reportword">
            <h5>Reports</h5>
        </div>
        <div class="approval">
            <i class="fa-solid fa-thumbs-up fa-2x"></i>
        </div>
        <div class="approveword">
            <h5>ApproveApplication</h5>
        </div>
        <div class="userman">
            <i class="fa-solid fa-user-group fa-2x"></i>
        </div>
        <div class="usersword">
            <h5>UsersManagement</h5>
        </div>
        <div class="usercre">
            <i class="fa-solid fa-user-plus fa-2x"></i>
        </div>
        <div class="usercreword">
            <h5>UserCreation</h5>
        </div>
        <div class="rates">
            <i class="fa-solid fa-book fa-2x"></i>
        </div>
        <div class="rateword">
            <h5>RatesManagement</h5>
        </div>
        <div class="accset">
            <i class="fa-sharp fa-solid fa-gears fa-2x"></i>
        </div>
        <div class="accsetword">
            <h5>AccountSettings</h5>
        </div>
    </div>

</body>

</html>
