<!DOCTYPE html>
<html>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<body>

  <canvas id="myChart" width="800" height="150"></canvas>

  <script>
      var xValues = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      var yValues = ['{{tu_mon.jan}}', '{{tu_mon.feb}}', '{{tu_mon.mar}}', '{{tu_mon.apr}}', '{{tu_mon.may}}', '{{tu_mon.jun}}', '{{tu_mon.jul}}', '{{tu_mon.aug}}', '{{tu_mon.sept}}', '{{tu_mon.oct}}', '{{tu_mon.nov}}', '{{tu_mon.dec}}'];

      new Chart("myChart", {
        type: "line",
        
        data: {
           labels: xValues,
        datasets: [{
          label: "Total Usage",
            fill: false,
            borderColor: '#20B2AA',
            tension: 0.1,
            backgroundColor: "#3090C7",
          data: yValues
          }]
        },
        options: {
          legend: { display: false },
          title: {
            display: true,
            text: "Monthly Total Usage"
          }
        },
        
      });
  </script>

  <br>

  <section>
    <canvas id="barangay" width="800" height="150"></canvas>
    <canvas id="monlth_view" width="800" height="150"></canvas>
    <br>
    <br>
    <br>
  </section>

  
   <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script>
   // setup 
   const data = {
     labels: [{%for tu_bay in tu_bay %}'{{tu_bay.barangaycode}}', {% endfor %}],
     datasets: [{
       label: 'Barangay Usage',
       data: [{%for tu_bay in tu_bay %}'{{ tu_bay.sum }}', {% endfor %}],
       backgroundColor: [
         'rgba(255, 26, 104, 0.2)',
         'rgba(54, 162, 235, 0.2)',
         'rgba(255, 206, 86, 0.2)',
         'rgba(75, 192, 192, 0.2)',
         'rgba(153, 102, 255, 0.2)',
         'rgba(255, 159, 64, 0.2)',
         'rgba(0, 0, 0, 0.2)'
       ],
       borderColor: [
         'rgba(255, 26, 104, 1)',
         'rgba(54, 162, 235, 1)',
         'rgba(255, 206, 86, 1)',
         'rgba(75, 192, 192, 1)',
         'rgba(153, 102, 255, 1)',
         'rgba(255, 159, 64, 1)',
         'rgba(0, 0, 0, 1)'
       ],
       borderWidth: 1
     }]
   };

   // config 
   const config = {
     type: 'bar',
     data,
     options: {
       scales: {
         y: {
           beginAtZero: true
         }
       }
     }
   };

   // render init block
   const barangay = new Chart(
     document.getElementById('barangay'),
     config
   );


   const data2 = {
     labels: [{%for tu_bay in tu_bay %}'{{tu_bay.barangaycode}}', {% endfor %}],
     datasets: [{
       label: 'Barangay Usage',
       data: [{%for tu_bay in tu_bay %}'{{ tu_bay.sum }}', {% endfor %}],
       backgroundColor:'rgba(255, 26, 104, 0.2)',
    
       
       borderColor:
         'rgba(255, 26, 104, 1)',
       borderWidth: 1
     }]
   };

   // config 
   const config2 = {
     type: 'bar',
     data: data2
     options: {
       scales: {
         y: {
           beginAtZero: true
         }
       }
     }
   };

   // render init block
   const monlth_view = new Chart(
     document.getElementById('monlth_view'),
     config2
   );
   </script>
</body>

</html>
