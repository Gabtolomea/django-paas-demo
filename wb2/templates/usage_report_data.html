<script src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>

<center><strong>Total Usage for Year Cubic Meter</strong></center>


<canvas id="myChart" style="width:100%;max-width:600px"></canvas>

<script>
var xValues = ["January", "February", "March", "April","May","June","July","August","September","October","November","December"];
var yValues = ['{{tu_mon.jan}}','{{tu_mon.FEB}}','{{tu_mon.mar}}','{{tu_mon.apr}}','{{tu_mon.may}}','{{tu_mon.jun}}','{{tu_mon.jul}}','{{tu_mon.aug}}','{{tu_mon.sept}}','{{tu_mon.oct}}','{{tu_mon.nov}}','{{tu_mon.dec}}'];
var barColors = ["red", "green","blue","orange","brown","yellow","pink","gray","black","cyan","tan","maroon"];

new Chart("myChart", {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    legend: {display: false},
    title: {
      display: true,
      text: "Total Usage for Year {{tu_mon.year}} Cubic Meter"
    }
  }
  
});
</script>
