<!DOCTYPE html>
<html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<body>

<canvas id="myChart" style="width:100%;max-width:900px"></canvas>

<script>
var xValues = ["January", "February", "March", "April","May","June","July","August","September","October","November","December"];
var yValues = ['{{tu_mon.jan}}','{{tu_mon.feb}}','{{tu_mon.mar}}','{{tu_mon.apr}}','{{tu_mon.may}}','{{tu_mon.jun}}','{{tu_mon.jul}}','{{tu_mon.aug}}','{{tu_mon.sept}}','{{tu_mon.oct}}','{{tu_mon.nov}}','{{tu_mon.dec}}'];
var barColors = ["red", "green","blue","orange","brown","yellow","pink","gray","black","cyan","tan","maroon"];

new Chart("myChart", {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    legend: {display: false},
    title: {
      display: true,
      text: "Monthly Total Usage"
    }
  }
});
</script>

<br>

<section>
  <canvas id="barangay" style="width:100%;max-width:900px"></canvas>
      <br>
      <br>
      <br>
    </section>
  
    
  <script>
    var xValues = [{%for tu_bay in tu_bay%}'{{tu_bay.barangaycode}}',{%endfor%}];
    var yValues = [{%for tu_bay in tu_bay%}{{tu_bay.sum}},{%endfor%}];
    var barColors = ["Cyan"];
    
    new Chart("barangay", {
      type: "bar",
      data: {
        labels: xValues,
        datasets: [{
          backgroundColor: barColors,
          data: yValues
        }]
      },
      options: {
        legend: {display: false},
        title: {
          display: true,
          text: 'By Barangay Total Usage',
        }
      }
      
    });
    </script>
</body>
</html>
