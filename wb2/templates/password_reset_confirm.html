{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" href="{% static 'images/logo.png' %}" type="images/png" sizes="16x16">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Reset Form </title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
</head>

<style>
	 html {
        height: auto;
        min-height: 100%;
    }
	body{
		background-image: linear-gradient(white,  #63CDD7);
	}

    .message.op-0 {
        opacity: 0;
        transition: opacity 1s;
    }
    .button2 {
        background-color: #006c85;
        color: white;
        padding: 8px 30px;
        border: none;
        border-radius: 15px;
        box-shadow: inset 0px -8px 7px 0 rgb(0 0 0 / 24%), inset 0px 5px 7px 0 rgb(255 255 255 / 52%), 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease 0.3s;
    }
    .btn.button2:hover {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px -8px 7px 0 rgba(0, 0, 0, 0.39), inset 0px 5px 7px 0 #e6ecebd8, 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease-in 0.5s;
    }
    .btn.button2:focus {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px 4px 7px 0 rgba(0, 0, 0, 0.274), inset 0px -5px 7px 0 #e6ecebd8;
        transition: all 0.1s;
    }
	@media (max-width: 350px) {
        h4 {
            font-size: 16px;
        }
    }

    @media (min-width: 351px) {
        h4 {
            font-size: 32px;
        }
    }
	@media (max-width: 350px) {
        .enter-password {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        .confirm-password {
            font-size: 15px;
        }
    }
</style>

<body>
    {% load crispy_forms_tags %}  
    <div class="container p-5">
	    <h2 class="font-weight-bold mt-3">Password Reset Confirm</h2>
		<hr>
        <p>Please enter your new password.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}                    
            <button class="btn btn-primary" type="submit">Reset password</button>
        </form>
    </div>
    <script src="{% static 'bootstrap.min.js' %}"></script>
    <script src="{% static 'jquery/jquery.js' %}"></script>
    <script src="{% static 'popper.min.js' %}"></script>
    
</body>

</html>
