<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>registration page</title>
		<!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

	</head>

	<body>
		<section id="registration-page">
			<form action="user_creation" class="signup-form" method="POST">
				{% csrf_token %}
				<div class="container-fluid">
					<div class="wrapper m-4">
						<div class="form-header">
							<h1>Registration Form</h1>
						</div>
						<div class="row form-group w-100 m-auto">
							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">First Name</label>			
								{{form.firstname}}						
							</div>

							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Middle Name</label>
								{{form.midname}}
								<input type="email" class="form-control">
							</div>

							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Last Name</label>
								{{form.lastname}}
								<input type="email" class="form-control">
							</div>
					
							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Mobile Number</label>
								{{form.mobilenum}}
								<input type="tel" name="txtPhone" class="form-control">
							</div>
								<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
									<label for="">Email</label>
									{{form.email}}
									<input type="email" class="form-control">
								</div>
								<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
									<label for="">User ID</label>

									<input type="user" class="form-control">
								</div>
						</div>
				
						<div class="row form-group w-100 m-auto">
							<div class="col-lg-6 col-md-6 col-sm-12 mb-3">
								<label for="">Password</label>
								{{form.password1}}
								<input type="email" class="form-control">
							</div>
							<div class="col-lg-6 col-md-6 col-sm-12 mb-3">
								<label for="">Confirm Password</label>
								{{form.password2}}
								<input type="email" class="form-control">
							</div>
						</div>
						<div class="name">
							<h3>Type of User</h3>
						</div>
						<input type="checkbox" id="admin" name="admin" value="Admin">
						<label for="admin">ADMIN</label><br>

						<input type="checkbox" id="teller" name="teller" value="Teller">
						<label for="teller">TELLER</label><br>

						<input type="checkbox" id="supervisor" name="supervisor" value="Supervisor">
						<label for="supervisor">SUPERVISOR</label><br>

						<input type="checkbox" id="manager" name="manager" value="Manager">
						<label for="manager">MANAGER</label><br>

						<input type="checkbox" id="meter" name="meter" value="Meter">
						<label for="meter">METER READER</label><br>
					
						<div class="row form-group w-100 m-auto">
							<div class="col-">
								<label for="">Authorized Approver</label>
								{{form.authorizedapprover}}
								<input type="email" class="form-control">
							</div>
							<div class="mb-3">
								<label for="formFile" class="form-label">Profile Picture</label>
								{{form.profilepic}}
								<input class="form-control" type="file" id="formFile">
							</div>
						</div>
						<input type="button" id="footer-subscription-button" class="footer-subscription-button" value="Submit">
					</div>
				</div>
			</form>
		</section>
	</body>
</html>
