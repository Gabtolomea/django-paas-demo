<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Registration Form</title>
		<link rel="stylesheet" type="text/css" href="/wb2/static/style.css" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

	</head>
	<style>

		html{
			height: 100%;
		}
		body{
			height: auto;
			background-image: linear-gradient(white,#63CDD7);
		}
	.form-header{
		font-family: Arial;
		margin: 0px 0px 16px;
		padding: 0px 12px;
	}
	.container{
		font-family: Arial ;
		color: #ffffff;
	}
	.wrapper{
		font: 16px Arial;
		margin: 0px 0px 16px;
		padding: 0px 12px;
		background: #63CDD7;
		border-radius: 40px;
		padding: 30px;
	}
	.approver{
		font: 16px Arial;
		margin: 0px 0px 16px;
		padding: 0px 12px;
	}
	.submit{
	background-color: #0093B7;
    color: white;
    border-radius: 25px;
    width: 100%;
	text-align: center;
	}
	</style>
	<body>
		<section id="registration-page">
			<form action=""class="signup-form">
				{% csrf_token %}

				<div class="container">
					<div class=" shadow wrapper m-4">
						<div class="form-header">
							<h1>Registration Form</h1>
						</div>
						<div class="row form-group w-100 m-auto">
							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">First Name*</label>
								{{form.firstname}}
							</div>

							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Middle Name*</label>
								{{form.midname}}

							</div>

							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Last Name*</label>
								{{form.lastname}}
							</div>
							<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
								<label for="">Mobile Number*</label>
								{{form.mobilenum}}
							</div>
								<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
									<label for="">Email*</label>
									{{form.email}}
								</div>
								<div class="col-lg-4 col-md-6 col-sm-12 mb-3">
									<label for="">User ID*</label>
									<input type="user" class="form-control">
								</div>
						</div>

						<div class="row form-group w-100 m-auto">
							<div class="col-lg-6 col-md-6 col-sm-12 mb-3">
								<label for="">Password*</label>
								{{form.password1}}
							</div>
							<div class="col-lg-6 col-md-6 col-sm-12 mb-3">
								<label for="">Confirm Password*</label>
								{{form.password2}}
							</div>
						</div>

						<div class="row m-auto w-100">
							<div class="col-lg-6 col-md-6 col-sm-12 mb-3">
							<h3>Type of User</h3>

							<input type="checkbox" id="admin" name="admin" value="Admin">
							<label for="admin">ADMIN</label><br>

							<input type="checkbox" id="teller" name="teller" value="Teller">
							<label for="teller">TELLER</label><br>

							<input type="checkbox" id="supervisor" name="supervisor" value="Supervisor">
							<label for="supervisor">SUPERVISOR</label><br>

							<input type="checkbox" id="manager" name="manager" value="Manager">
							<label for="manager">MANAGER</label><br>

							<input type="checkbox" id="meter" name="meter" value="Meter">
							<label for="meter">METER READER</label><br>
							</div>
					    </div>
						<div class="row w-100 m-auto mb-3">
							<div class="col-lg-12 col-md-12 col-sm-12 mb-4">
								<div class="input-group mb-2">
									<label class="input-group-text" for="inputGroupSelect01">Authorized Approver</label>
									<select class="form-select" id="inputGroupSelect01">
									  <option selected>Approver for Inbound Application</option>
									  <option value="1">Non Approver</option>
									  <option value="2">Supervisor</option>
									  <option value="3">Engineer's Office</option>
									  <option value="3">Mayor's Office</option>
									</select>
								  </div>
							</div>
							<div class="profile mb-3">
								<label for="formFile" class="form-label">Profile Picture*</label>
								{{form.profilepic}}
							</div>
						</div>
						<button type="button" id="footer-subscription-button" class="btn submit" >Submit</button>
					</div>
				</div>
			</form>
		</section>
	</body>
</html>
