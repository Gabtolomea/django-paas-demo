<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <section id="main-content">
            <section id="main-content">
                <section class="wrapper">

                Button trigger modal 
                <br>
                

                    <div class="table-responsive">

                        <table id="tablePagination" class="table table-striped table-bordered" style="width:100%">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Update</th>
                                    <th scope="col">Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    {%for user,role in all_user%}
                                    <td> {{ user.userid }}</td>
                                    <td>{{ user.firstname }} {{ user.lastname }}</td>
                                    <td>{{  user.emailaddress }}</td>
                                    <td>{{ role}}</td>
                                    <td>
                                        <a href="/source_access/edit_systemuser={{ user.userid }}"><button class="btn btn-success btn-sm rounded-0" data-toggle="modal" type="button"     data-placement="top" title="Edit"><i class="fa fa-edit"></i></button></a>
                                    </td>      
                                    <td>
                                        <a href="/delete-this-system-user={{ user.userid }}"><button class="btn btn-danger btn-sm rounded-0" type="button" onclick="return confirm('Are you sure you want to delete this System User( {{ user.userid }} )?')" data-placement="top" title="Delete"><i class="fa fa-trash"></i></button></a>
                                    </td>

                                </tr>


                            {%endfor%}
                            </tbody>

                        </table>

                    </div>

                    </div>
                </div>
            </div>
        </div>

                </section>
            </section>
        </section>
</body>
</html>
