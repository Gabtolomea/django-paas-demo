    <script>
        function first_toggle() {
            document.getElementById("side_nav").style.width = "0";
            document.getElementById("first_toggle").style.display = "none";
            document.getElementById("second_toggle").style.display = "inline";
            document.getElementById("side_nav").style.transition = "all 1s ease";
            document.getElementById("side_nav").style.opacity = "0";
        }
        function second_toggle() {
            document.getElementById("side_nav").style.width = "400px";
            document.getElementById("first_toggle").style.display = "inline";
            document.getElementById("second_toggle").style.display = "none";
            document.getElementById("side_nav").style.transition = "all 1 ease";
            document.getElementById("side_nav").style.opacity = "1";
        } 
    </script>
