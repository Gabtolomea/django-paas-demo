{% load humanize %}
<!DOCTYPE html>
<html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<div>
  {% csrf_token %}
  <div class="col-sm-offset-7 col-sm-5">
    <div class="form-group">
      <label for="exampleInputBarangay">Select Year</label>
      <form id="yearselection" action="GET">
        <select class="form-select" id="selector" onchange="change()">
          <option value="{{cur_year}}">{{cur_year}}</option>
        {% for i in years reversed %}
        <option value="{{i}}">{{i}}</option>
        {% endfor %}
        </select>
      </form>
      <script>
        yearselection = document.getElementById("yearselection")
        selector = document.getElementById("selector")
        function change() {
          yearselection.action = selector.value
          yearselection.submit()
          console.log("selction testing")
          
        }
      </script>
    </div>

<body>
  <div id="reportPage">
    <button type="button" id="postbtn" onclick="this_record()">Get a Copy</button>
    <br>

   <center><strong>Total Monthly Collection for The  Year of {{cur_year}}: </strong></center>
   <center><strong>&#8369;  {{col|floatformat:2|intcomma}}</strong></center>
    <canvas id="myChart" width="800" height="150">
    <script>
      var xValues = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      y = ['{{rev_col.jan}}', '{{rev_col.feb}}', '{{rev_col.mar}}', '{{rev_col.apr}}', '{{rev_col.may}}', '{{rev_col.jun}}', '{{rev_col.jul}}', '{{rev_col.aug}}', '{{rev_col.sept}}', '{{rev_col.oct}}', '{{rev_col.nov}}', '{{rev_col.dec}}'];
      var yValues = []
      for (var i = 0; i < y.length; i++) {
        if (y[i] <= 0) {
          yValues.push(null)
        } else {
          yValues.push(y[i])
        }
      }

      new Chart("myChart", {
        type: "line",
        data: {
          labels: xValues,
          datasets: [{
            label: "Total Collection",
            fill: false,
            borderColor: '#20B2AA',
            tension: 0.1,
            backgroundColor: "#3090C7",
            data: yValues
          }]
        },
        options: {
          title: {
            display: true,
            text: "Monthly Total Collection"

          }
        }

      });
    </script>
    </canvas>

    <section>
      <br>
      <br>
      <br>
      <br>
      <br>
      <center><strong>Total Monthly Collictables for The  Year of {{cur_year}}:</strong></center>
      <center><strong>&#8369;  {{rec|floatformat:2|intcomma}}</strong></center>
      <canvas id="receivable" width="800" height="150">
      
    </section>
    <script>
      var xValues = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      var y = ['{{rev_rec.jan}}', '{{rev_rec.feb}}', '{{rev_rec.mar}}', '{{rev_rec.apr}}', '{{rev_rec.may}}', '{{rev_rec.jun}}', '{{rev_rec.jul}}', '{{rev_rec.aug}}', '{{rev_rec.sept}}', '{{rev_rec.oct}}', '{{rev_rec.nov}}', '{{rev_rec.dec}}'];
      var yValues = []
      for (var i = 0; i < y.length; i++) {
        if (y[i] <= 0) {
          yValues.push(null)
        } else {
          yValues.push(y[i])
        }

      }

      new Chart("receivable", {
        type: "line",
        data: {
          labels: xValues,
          datasets: [{
            label: "Total Collictables",
            fill: false,
            borderColor: '#20B2AA',
            tension: 0.1,
            backgroundColor: "#3090C7",
            data: yValues,
          }]
        },
        options: {
          legend: { display: false },
          title: {
            display: true,
            text: "Monthly Total Receivable"
          }
        }
      }

      );
    </script>
    </canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.3.2/jspdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.6/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
  <script type="text/javascript">
    function this_record() {
      var jan_amount = ("{{rev_col.jan}}") + ("{{rev_rec.jan}}") 
      var feb_amount = ("{{rev_col.feb}}") + ("{{rev_rec.feb}}") 
      var mar_amount = ("{{rev_col.mar}}") + ("{{rev_rec.mar}}") 
      var apr_amount = ("{{rev_col.apr}}") + ("{{rev_rec.apr}}") 
      var may_amount = ("{{rev_col.may}}") + ("{{rev_rec.may}}") 
      var jun_amount = ("{{rev_col.jun}}") + ("{{rev_rec.jun}}") 
      var jul_amount = ("{{rev_col.jul}}") + ("{{rev_rec.jul}}") 
      var aug_amount = ("{{rev_col.aug}}") + ("{{rev_rec.aug}}") 
      var sept_amount = ("{{rev_col.sept}}") + ("{{rev_rec.sept}}") 
      var oct_amount = ("{{rev_col.oct}}") + ("{{rev_rec.oct}}") 
      var nov_amount = ("{{rev_col.nov}}") + ("{{rev_rec.nov}}") 
      var dec_amount = ("{{rev_col.dec}}") + ("{{rev_rec.dec}}") 

      
		canvas = document.getElementById("myChart")
   	canvasImg = canvas.toDataURL("image/png", 1.0);
    canvas = document.getElementById("receivable")
   	canvasImgs = canvas.toDataURL("image/png", 1.0);
      /// Currency formatter
    const numberformat = new Intl.NumberFormat('en-PH', {
              style: 'currency',
              currency: 'PHP',
              currencyDisplay: 'code'
              

            });
      var body = [

              ['January', numberformat.format('{{rev_col.jan}}'), numberformat.format('{{rev_rec.jan}}'), numberformat.format(jan_amount)],
              ['Febuary', numberformat.format('{{rev_col.feb}}'), numberformat.format('{{rev_rec.feb}}'), numberformat.format(feb_amount)],
              ['March', numberformat.format('{{rev_col.mar}}'), numberformat.format('{{rev_rec.mar}}'), numberformat.format(mar_amount)],
              ['April', numberformat.format('{{rev_col.apr}}'), numberformat.format('{{rev_rec.apr}}'), numberformat.format(apr_amount)],
              ['May', numberformat.format('{{rev_col.may}}'), numberformat.format('{{rev_rec.may}}'), numberformat.format(may_amount)],
              ['June', numberformat.format('{{rev_col.jun}}'), numberformat.format('{{rev_rec.jun}}'), numberformat.format(jun_amount)],
              ['July', numberformat.format('{{rev_col.jul}}'), numberformat.format('{{rev_rec.jul}}'), numberformat.format(jul_amount)],
              ['August', numberformat.format('{{rev_col.aug}}'), numberformat.format('{{rev_rec.aug}}'), numberformat.format(aug_amount)],
              ['September', numberformat.format('{{rev_col.sept}}'), numberformat.format('{{rev_rec.sept}}'), numberformat.format(sept_amount)],
              ['October', numberformat.format('{{rev_col.oct}}'), numberformat.format('{{rev_rec.oct}}'), numberformat.format(oct_amount)],
              ['November', numberformat.format('{{rev_col.nov}}'), numberformat.format('{{rev_rec.nov}}'), numberformat.format(nov_amount)],
              ['December', numberformat.format('{{rev_col.dec}}'), numberformat.format('{{rev_rec.dec}}'), numberformat.format(dec_amount)],
            ]

      console.log(body)

      //print details
      var doc = new jsPDF('l', 'pt', 'a4');
      var y = 10;
      var x = 20;
      doc.setLineWidth(2);
      doc.setFontSize(15);
      doc.setFillColor(255, 255, 255);
      doc.text(270, y = y + 20, "Revenue Detailed Report for the Year {{cur_year}}");
      doc.autoTable({
        head: [['Month', 'Collected', 'Collectable', 'Total']],
        margin: { top: 20, bottom: 20 },
        avoidPageSplit: true,
        body: body,
        columnStyles: { align: "right" },
        theme: 'striped',
        startY: 70,
      })
    doc.setFontSize(8)
    doc.text(290, y = y + 360, "Total Monthly Collection for The  Year of {{cur_year}}");
    y = doc.lastAutoTable.finalY
		doc.setFillColor(255, 255,255);
		doc.addImage(canvasImg, 'JPEG', x+75, y+70, 700, 200)
    
    doc.setFontSize(8)
    doc.text(290, y = y + 360, "Total Monthly Collectibles for The  Year of {{cur_year}}");
    y = doc.lastAutoTable.finalY
		doc.setFillColor(255, 255,255);
		doc.addImage(canvasImg, 'JPEG', x+75, y+70, 700, 200)
  
    console.log(y);
		if (y > 600) {
			doc.addPage()
			y = 20
		}
      doc.setFontSize(12)
      console.log("testing")
      doc.save('testing.pdf')

    }

  </script>
</body>

</html>
