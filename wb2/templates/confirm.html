 {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Password</title>
    <link rel="stylesheet" type="text/css" href="{% static 'forgotpassword.css'%}" />

    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">

</head>
    <style>
        html{
            background-image: linear-gradient(white,#63CDD7);
            height: 100%;
            font-family: 'Poppins',sans-serif;
          }
          body{
            margin: 10%;
            background: transparent!important;
            height: 450px;
          }
          .meter{
            margin: 25px 0 0 0;
            width: 100%;
            height: 50px;
            color: rgb(238, 226, 226);
            font-size: 18px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.438);
            border-radius: 8px;
            background: rgba(105, 105, 105, 0);
            margin-top: 40px;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
          }

          .FP{
            text-align: right;
            padding-right: 60px;

          }
          .password{
            font-family: 'Poppins',sans-serif;
            font-weight: 500;
          }
          .header{
            font-family: 'Poppins',sans-serif;
            text-align: center;
            color: white;
            padding-left: 10%;
            padding-right: 10%;
          }
          .container{
            padding: 0 10px;
          }
          .confirm{
            font-weight: normal;
            color: white;
          }
          .btn{
            font-size: 13px;
          }

          @media (max-width: 350px){
            p { font-size: 10px;}
          }
          @media (min-width: 351px){
            p { font-size: 15px;}
          }

          @media (max-width: 575px){
            button.btn{
              font-size: 11px !important;
            }
          }
    
         @media (max-width: 350px){
            ::placeholder {font-size: 10px;}
          }
    
          @media (min-width: 351px){
            ::placeholder {font-size: 15px; }
          }

          @media (max-width: 350px){
            h4 { font-size: 16px;}
          }
          @media (min-width: 351px){
            h4 { font-size: 32px;}
          }
    
    

    </style>
<body>
    <div class="container">
        <div class="wrapper shadow" style=" margin: 10% auto !important; border-radius: 30px;  max-width: 400px; padding: 40px 0; background: #63CDD7; height:450px;">
            <div class="log-in" style="padding-right: 15px">
                <center>
                  <h4 class="confirm">Confirm Your Password</h4>
                </center>
                <br>
            </div>
            <center>
                <form action="" method="post">
                <!--{% csrf_token %}-->
                <p class="header">Please double-check your password before clicking "SUBMIT" button.</p>
                    <div class="form-group m-2 w-75">
                        <input type="password" name="email" style="border-radius: 20px; width=75%; " class="form-control" placeholder="New Password">
                    </div>
                    <div class="form-group m-2 w-75">
                        <input type="password" name="email" style="border-radius: 20px; width=75%; " class="form-control" placeholder="Confirm Password">
                    </div>
                    <div class="form-group m-2 w-75"   >
                        <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 80%; margin-top: 5%" type="submit" class="btn ">SUBMIT</button style>
                    </div>
                </form>
            </center>

        </div>

    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>

</body>
</html>
