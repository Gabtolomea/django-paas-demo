<!-- buttons -->
<div class="col-lg-6 col-md-6 col-sm-12" style="padding-top: 10px; margin-bottom: 30px;">
    <div style="white-space: nowrap; position: relative; z-index: 1;">
        <!-- Ledger -->
        <a href="{% url 'ledger' u.consumer_id %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Ledger
        </a>
        <!-- Outstanding Balances -->
        <a href="{% url 'monthly_summary' u.consumer_id year %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Outstanding Balances
        </a>
        <!-- Payment History -->
        <a href="{% url 'payment_history' u.consumer_id year %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Payment History
        </a>
        <span style="display: inline-block; margin-right: 5px; position: relative; z-index: 10;">
            <button type="button" class="btn button2" data-bs-toggle="modal" data-bs-target="#installment"> Purchase Materials </button>
        </span>
        <span style="display: inline-block; margin-right: 5px; position: relative; z-index: 10;">
            <a href="{% url 'additionalfeeslist' u.consumer_id %}" class="btn button2" role="button"> List of Purchased Materials </a>
        </span>
    </div>
</div>

<style>
    /*Additional Payment Style */
    .modal-content {
        border-radius: 12px;
        border: none;
        background-color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease-in-out;
    }
    .modal-header {
        background-color: #005F73;
        color: #ffffff;
        border-bottom: none;
        padding: 1.25rem 1.5rem;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
    }
    .modal-title {
        font-size: 1.25rem;
        font-weight: 600;
    }
    .modal-body {
        padding: 1.5rem;
    }
    .modal-footer {
        background-color: #ffffff;
        border-top: 1px solid #ccc;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        padding: 1rem 1.5rem;
    }
    .modal-backdrop {
        background-color: rgba(0, 0, 0, 0.75) !important;
        /* lighter, try 0.3 to 0.7 */
    }
    .form-label {
        color: #005F73;
        font-weight: 500;
        margin-bottom: 0.4rem;
    }
</style>

<!-- Installment Fee Modal -->
<div class="modal fade" id="installment" tabindex="-1" role="dialog" aria-labelledby="installment" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <form id="additionalfeeform" action="{% url 'additional_fee' u.consumer_id %}" method="post">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Additional Fees</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="fees-table">
                            <thead class="table-light">
                                <tr>
                                    <th>Item</th>
                                    <th>Price per Item</th>
                                    <th>No. of Installment</th>
                                    <th>Monthly Due</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" name="item_name[]" class="form-control" placeholder="Item" required></td>
                                    <td><input type="number" name="price[]" class="form-control price-input" placeholder="Price" required></td>
                                    <td><input type="number" name="monthly_installment[]" class="form-control installment-input" placeholder="Monthly Installment" required></td>
                                    <td><input type="number" name="monthly_due[]" class="form-control monthly-due" readonly></td>
                                    <td><button type="button" class="btn btn-sm btn-danger remove-row " style="margin-top: 9px;">Remove</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <button type="button" class="btn btn-secondary mb-3" id="add-row">+ Add Row</button>
                    <div>
                        <label>Total Amount: ₱<span id="total-fees">0.00</span></label>
                        <input type="hidden" name="totalAmount" id="totalAmount" value="0.00">
                    </div>
                </div>

                <!-- Hidden input for concatenated fee names -->
                <input type="hidden" name="additionalfee_names" id="additionalfee_names" required>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function recalcRow(row) {
        const priceInput = row.querySelector('.price-input');
        const installmentInput = row.querySelector('.installment-input');
        const monthlyDue = row.querySelector('.monthly-due');
        // Safe conversion: empty string defaults to 0
        const price = parseFloat(priceInput.value) || 0;
        const installment = parseFloat(installmentInput.value) || 0;
        if (installment > 0) {
            monthlyDue.value = (price / installment).toFixed(2);
        } else {
            monthlyDue.value = "0.00";
        }
    }

    // Update total amount
    function updateTotal() {
        let total = 0;
        document.querySelectorAll('#fees-table tbody tr').forEach(row => {
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            total += price;
        });
        document.getElementById('total-fees').innerText = total.toFixed(2);
        document.getElementById('totalAmount').value = total.toFixed(2);
    }

    // Attach events to a row
    function attachEvents(row) {
        const priceInput = row.querySelector('.price-input');
        const installmentInput = row.querySelector('.installment-input');
        priceInput.addEventListener('input', () => {
            recalcRow(row);
            updateTotal();
        });
        installmentInput.addEventListener('input', () => { recalcRow(row); });
        const removeBtn = row.querySelector('.remove-row');
        removeBtn.addEventListener('click', () => {
            row.remove();
            updateTotal();
        });
        // Set default monthly due
        row.querySelector('.monthly-due').value = "0.00";
    }

    // Initial row setup
    document.querySelectorAll('#fees-table tbody tr').forEach(attachEvents);

    // Add new row
    document.getElementById('add-row').addEventListener('click', () => {
        const tbody = document.querySelector('#fees-table tbody');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td><input type="text" name="item_name[]" class="form-control" placeholder="Item" required></td>
            <td><input type="number" name="price[]" class="form-control price-input" placeholder="Price" required></td>
            <td><input type="number" name="monthly_installment[]" class="form-control installment-input" placeholder="Monthly Installment" required></td>
            <td><input type="number" name="monthly_due[]" class="form-control monthly-due" readonly></td>
            <td><button type="button" class="btn btn-sm btn-danger remove-row">Remove</button></td>
        `;
        tbody.appendChild(newRow);
        attachEvents(newRow);
    });

    // Initial calculation
    document.querySelectorAll('#fees-table tbody tr').forEach(row => recalcRow(row));
    updateTotal();
</script>

<script>
    // Function to reset modal
    function resetModal() {
        const tbody = document.querySelector('#fees-table tbody');
        tbody.innerHTML = `
            <tr>
                <td><input type="text" name="item_name[]" class="form-control" placeholder="Item" required></td>
                <td><input type="number" name="price[]" class="form-control price-input" placeholder="Price" required></td>
                <td><input type="number" name="monthly_installment[]" class="form-control installment-input" placeholder="Monthly Installment" required></td>
                <td><input type="number" name="monthly_due[]" class="form-control monthly-due" readonly></td>
                <td><button type="button" class="btn btn-sm btn-danger remove-row">Remove</button></td>
            </tr>
        `;
        // Reset totals
        document.getElementById('total-fees').innerText = "0.00";
        document.getElementById('totalAmount').value = "0.00";
        document.getElementById('additionalfee_names').value = "";

        // Reattach events to the single row
        document.querySelectorAll('#fees-table tbody tr').forEach(attachEvents);
        document.querySelectorAll('#fees-table tbody tr').forEach(row => recalcRow(row));
    }

    // Listen for modal close event
    const installmentModal = document.getElementById('installment');
    installmentModal.addEventListener('hidden.bs.modal', resetModal);
</script>
