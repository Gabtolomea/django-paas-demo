<!-- buttons -->
<div class="col-lg-6 col-md-6 col-sm-12" style="padding-top: 10px; margin-bottom: 30px;">
    <div style="white-space: nowrap; position: relative; z-index: 1;">
        <!-- Ledger -->
        <a href="{% url 'ledger' u.consumer_id %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Ledger
        </a>

        <!-- Outstanding Balances -->
        <a href="{% url 'monthly_summary' u.consumer_id year %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Outstanding Balances
        </a>

        <!-- Payment History -->
        <a href="{% url 'payment_history' u.consumer_id year %}" class="btn button2" style="margin-right: 5px; position: relative; z-index: 10;">
            Payment History
        </a>

        <span style="display: inline-block; margin-right: 5px; position: relative; z-index: 10;">
            <button type="button" class="btn button2" data-bs-toggle="modal" data-bs-target="#installment">
                Additional Fees
            </button>
        </span>

        <span style="display: inline-block; margin-right: 5px; position: relative; z-index: 10;">
            <a href="{% url 'additionalfeeslist' u.consumer_id %}" class="btn button2" role="button">
                List of Additional Fees
            </a>
        </span>
    </div>
</div>
<style>
/*Additional Payment Style */
    .modal-content {
        border-radius: 12px;
        border: none;
        background-color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease-in-out;
    }

    .modal-header {
        background-color: #005F73;
        color: #ffffff;
        border-bottom: none;
        padding: 1.25rem 1.5rem;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
    }

    .modal-title {
        font-size: 1.25rem;
        font-weight: 600;
    }

    .modal-body {
        padding: 1.5rem;
    }

    .modal-footer {
        background-color: #ffffff;
        border-top: 1px solid #ccc;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        padding: 1rem 1.5rem;
    }

    .modal-backdrop {
    background-color: rgba(0, 0, 0, 0.75) !important; /* lighter, try 0.3 to 0.7 */
    }
    
    .form-label {
        color: #005F73;
        font-weight: 500;
        margin-bottom: 0.4rem;
    }

    
</style>
<!-- Installment Fee Modal -->
<div class="modal fade" id="installment" tabindex="-1" role="dialog" aria-labelledby="installment" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <form id="additionalfeeform" action="{% url 'additional_fee' u.consumer_id  %}" method="post">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalCenterTitle">Additional Fees</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <div class="form-group mt-2">
                        <label for="meternum" class="form-label">No. of Items <span class="text-danger">*</span></label>
                        <input class="form-control" required type="number" id="inputs_num" oninput="addInputs(this.value)">
                    </div>

                    <div class="additional-fees" style="display: none;">
                        <div class="form-group">
                            <label for="item-details" class="form-label">Fee Names:</label>

                            <div class="form-group">
                                <label for="meternum" class="form-label">Month Range <span class="text-danger">*</span> </label>
                                <input type="number" name="monthfee" class="form-control" oninput="check_valid()" required id="monthfee">
                            </div>
                        </div>

                        
                    </div>
                </div>
<script>
    function check_valid() {
        let afform = document.getElementById('additionalfeeform');
        let inputs = afform.querySelectorAll('input[required]');
        let numbers = Array.from(inputs).filter(input => input.type === 'number');
        let texts = Array.from(inputs).filter(input => input.type === 'text');

        let valid = numbers.every(input => input.checkValidity());
        let valid2 = texts.every(input => input.checkValidity());

        document.getElementById('submit-btn').disabled = !(valid && valid2);
    }

    function addInputs(numInputs) {
        let additionalFeesDiv = document.querySelector('.additional-fees');
        additionalFeesDiv.style.display = 'block';

        let formGroup = additionalFeesDiv.querySelector('.form-group');

        formGroup.innerHTML = '';

        // Add Item Details label
        let label = document.createElement('label');
        label.classList.add('form-label', 'mt-3', 'mb-1');
        label.setAttribute('for', 'item-details');
        label.innerText = 'Item Details:';
        formGroup.appendChild(label);

        // Add Item Name + Amount pairs
        for (let i = 0; i < numInputs; i++) {
            let div = document.createElement('div');
            div.classList.add('row');

            let textDiv = document.createElement('div');
            textDiv.classList.add('col-md-6');

            let inputText = document.createElement('input');
            inputText.type = 'text';
            inputText.classList.add('form-control', 'mb-1');
            inputText.required = true;
            inputText.placeholder = 'Item Name';
            inputText.addEventListener('input', updateTotalAmount);
            textDiv.appendChild(inputText);

            let numberDiv = document.createElement('div');
            numberDiv.classList.add('col-md-6');

            let inputNumber = document.createElement('input');
            inputNumber.type = 'number';
            inputNumber.classList.add('form-control', 'mb-1', 'fee-amount'); //added fee-amount -10/3/2025
            inputNumber.required = true;
            inputNumber.addEventListener('input', updateTotalAmount);
            numberDiv.appendChild(inputNumber);

            div.appendChild(textDiv);
            div.appendChild(numberDiv);
            formGroup.appendChild(div);
        }

        // ➕ Month Range input block
        let monthRangeDiv = document.createElement('div');
        monthRangeDiv.classList.add('form-group', 'mt-3');
        monthRangeDiv.innerHTML = `
            <label for="monthfee" class="form-label">Month Range <span class="text-danger">*</span></label>
            <input type="number" name="monthfee" class="form-control" oninput="check_valid()" required id="monthfee">
        `;
        formGroup.appendChild(monthRangeDiv);

        // 🧾 Hidden input for total amount
        let totalAmountInput = document.createElement('input');
        totalAmountInput.type = 'hidden';
        totalAmountInput.name = 'totalAmount';
        totalAmountInput.value = calculateTotalAmount().toFixed(2);
        formGroup.appendChild(totalAmountInput);

        // 🧾 Hidden input for additional fee names
        /*let additionalFeeNames = document.createElement('input');
        additionalFeeNames.type = 'hidden';
        additionalFeeNames.name = 'additionalfee_names';
        formGroup.appendChild(additionalFeeNames);*/addInputs
        let additionalFeeNames = document.querySelector('input[name="additionalfee_names"]');


        // 🏷️ Total Amount label display
        let totalAmountLabel = document.createElement('label');
        totalAmountLabel.id = 'total-amount-fees';
        totalAmountLabel.innerText = 'Total Amount Fees: ₱' + totalAmountInput.value;
        formGroup.appendChild(totalAmountLabel);

        // Run update once to fill values
        updateTotalAmount();
    }

    function updateTotalAmount() {
        let totalAmount = calculateTotalAmount();

        let totalAmountInput = document.querySelector('input[name="totalAmount"]');
        if (totalAmountInput) {
            totalAmountInput.value = totalAmount.toFixed(2);
        }

        let totalAmountLabel = document.getElementById('total-amount-fees');
        if (totalAmountLabel) {
            totalAmountLabel.innerText = 'Total Amount Fees: ₱' + totalAmount.toFixed(2);
        }

        // Join all item names
        let feeInputs = document.querySelectorAll('.additional-fees input[type="text"]');
        let feeNames = Array.from(feeInputs)
            .map(input => input.value.trim())
            .filter(val => val !== '');
        let feeNamesStr = feeNames.join(' + ');

        let additionalFeeNamesInput = document.querySelector('input[name="additionalfee_names"]');
        if (additionalFeeNamesInput) {
            additionalFeeNamesInput.value = feeNamesStr;
        }

        check_valid();
    }

    function calculateTotalAmount() {
        let total = 0;
        let numberInputs = document.querySelectorAll('.additional-fees input.fee-amount'); //input[type="number"] 10/3/2025

        numberInputs.forEach(input => {
            total += Number(parseFloat(input.value) || 0);
        });
        return total;
    }
</script>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button id="submit-btn" type="submit" disabled class="btn btn-primary" name="btnform1">Submit</button>
                </div>

                <!-- Add the hidden input field for concatenated fee names -->
                <input type="hidden" name="additionalfee_names" id="additionalfee_names" required>
            </form>
        </div>
    </div>
</div>
