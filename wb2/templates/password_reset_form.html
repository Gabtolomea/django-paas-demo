<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" href="{% static 'images/logo.png' %}" type="images/png" sizes="16x16">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Reset Form </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<style>
	 html {
        height: auto;
        min-height: 100%;
    }
	body{
		background-image: linear-gradient(white,  #63CDD7);
	}

    .message.op-0 {
        opacity: 0;
        transition: opacity 1s;
    }
    .button2 {
        background-color: #006c85;
        color: white;
        padding: 8px 30px;
        border: none;
        border-radius: 15px;
        box-shadow: inset 0px -8px 7px 0 rgb(0 0 0 / 24%), inset 0px 5px 7px 0 rgb(255 255 255 / 52%), 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease 0.3s;
    }
    .btn.button2:hover {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px -8px 7px 0 rgba(0, 0, 0, 0.39), inset 0px 5px 7px 0 #e6ecebd8, 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease-in 0.5s;
    }
    .btn.button2:focus {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px 4px 7px 0 rgba(0, 0, 0, 0.274), inset 0px -5px 7px 0 #e6ecebd8;
        transition: all 0.1s;
    }
	@media (max-width: 350px) {
        h4 {
            font-size: 16px;
        }
    }

    @media (min-width: 351px) {
        h4 {
            font-size: 32px;
        }
    }
	@media (max-width: 350px) {
        .previous-password {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        .new-password {
            font-size: 15px;
        }
    }
</style>

<body>
	<form action="" method="POST">
		<div class="container">
			<div class="wrapper shadow"
				style=" margin: 10% auto !important; border-radius: 40px;  max-width: 450px; padding-top: 20px;
				padding-bottom: 20px; background:  #63CDD7;">
				<div class="new_pass" style="padding-right: 15px">
					<center>
						<h3 style="color:white">Enter New Password</h3>
						<p style="color:white">Please enter your new password twice so we can verify you typed it in
							correctly.</p>
					</center>
				</div>
				<br>
				<center>
					<div class="inputs__item">
						<label for="previous-password" class="inputs__label" style="color: white; font-size: 20px;">Previous Password</label>
						<input style="width: 250px;" type="password" class="form-control" class="inputs__input" id="previous-password" value="password" />
					</div>
					<div class="inputs__item inputs__item--new" style="margin-top: 15px;">
						<label for="new-password" class="inputs__label" style="color: white; font-size: 20px;">New Password</label>
						<input style="width: 250px;" type="password" class="form-control" class="inputs__input" id="new-password" value="password" />
					</div>
					<br>
					<div class="button-container">
                        <button class="btn button2"><i class="fa fa-check-square-o">
                            <span style="padding: 10px; font-family: Arial;">Submit</span></i></button>
                    </div>
				</center>
			</div>
		</div>
	</form>
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>

</html>
