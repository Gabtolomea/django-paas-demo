
<style>
  html{
      background-color: #F2F3F2;
  }
  table {
      border: 1px solid #ccc;
      border-collapse: collapse;
      margin: 0;
      padding: 0;
      width: 100%;
      table-layout: fixed;
    }
    
    table caption {
      font-size: 1.5em;
      margin: .5em 0 .75em;
    }
    
    table tr {
      background-color: #f8f8f8;
      border: 1px solid #ddd;
      padding: .35em;
    }
    
    table th,
    table td {
      padding: .625em;
      text-align: center;
    }
    
    table th {
      font-size: .85em;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    
    @media screen and (max-width: 600px) {
      table {
        border: 0;
      }
    
      table caption {
        font-size: 1.3em;
      }
      
      table thead {
        border: none;
        clip: rect(0 0 0 0);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        width: 1px;
      }
      
      table tr {
        border-bottom: 3px solid #ddd;
        display: block;
        margin-bottom: .625em;
      }
      
      table td {
        border-bottom: 1px solid #ddd;
        display: block;
        font-size: .8em;
        text-align: right;
      }
      
      table td::before {
        
        content: attr(data-label);
        float: left;
        font-weight: bold;
        text-transform: uppercase;
      }
      
      table td:last-child {
        border-bottom: 0;
      }
    }
    body {
      font-family: "Open Sans", sans-serif;
      line-height: 1.25;
    }

    @media (max-width: 400px){
      h2 { font-size: 20px;}
  }
  @media (min-width: 401px){
      h2 { font-size: 32px;}
  }

  @media (max-width: 400px){
      h3 { font-size: 15px;}
  }
  @media (min-width: 401px){
      h3 { font-size: 20px;}
  }
 
  #years{
      width: 180px;
      height: 23px;
      border-radius: 50px;
      
  }
</style>

  <label style= "font-weight: bold; font-size: 1.3em; margin-bottom: 70px;  text-align: center; margin-top: 30px;">Barangay Yearly Records for Year {{bang.barangaycode}}</label>

  <body onload ="collection_rate()">
<table>
    <thead>
        <tr>
            <th scope="col" style="background-color: #63CDD7; font-size: 12px;">Billing Cycle Cutoff Month</th>
            <th scope="col" style="background-color: #808080; font-size: 12px;">Total Usage (Cubic Meter)</th>
            <th scope="col" style="background-color: #808080; font-size: 12px;">Total Receivable</th>
            <th scope="col" style="background-color: #808080; font-size: 12px;">Total Collection</th>
            
        </tr>
    </thead>
    <tbody>
        <tr>
          <td data-label="Billing Cycle Cutoff Month" style="background-color: #DBF3FA;">January</td>
          <td data-label="Total Usage (Cubic Meter)" style="background-color: #D3D3D3;">{{bang.total_usage_jan|floatformat:1}}</td>
          <td data-label="Total Receivable" style="background-color: #D3D3D3;">{{bang.total_due_jan|floatformat:1}}</td>
          <td data-label="Total Collection" style="background-color: #D3D3D3;">{{bang.total_paid_jan|floatformat:1}}</td>
        </tr>
      </tbody>
</table>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script>
    function collection_rate(){
      total_paid = document.getElementsByClassName("total_paid")
      total_due = document.getElementsByClassName("total_due")
      rate = document.getElementsByClassName("rate")

      for (let index = 0; index < rate.length; index++) {
        int_total_due = parseInt(total_due[index].innerHTML)
        int_total_paid = parseInt(total_paid[index].innerHTML)
        temporary_rate = (int_total_paid / int_total_due)* 100
        if (temporary_rate!==temporary_rate){
          rate[index].innerHTML = "0.0%"
        }else{
          rate[index].innerHTML = temporary_rate.toFixed(2)+ "%"
        }
        console.log("test")
      }
    }


  </script>
