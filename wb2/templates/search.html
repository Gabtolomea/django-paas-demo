
{% load static %}
{% load humanize %}
<div class="row">
    <div class="col-sm-12 col-md-4 col-lg-4">
        <form id="yearselection" style="padding: 10px;" class="dataTables_length" action="" method="GET">
            <label style="display:flex;">Show
                <select id="selector" name="p" style="width: 100px; margin: 0 5px;" class="form-select form-select-sm" onchange="change()">
                    <option disabled selected value>--Select--</option>
                    <option value="10" {% if paginate_by == 10 %}selected{% endif %}>10</option>
                    <option value="25" {% if paginate_by == 25 %}selected{% endif %}>25</option>
                    <option value="50" {% if paginate_by == 50 %}selected{% endif %}>50</option>
                    <option value="100" {% if paginate_by == 100 %}selected{% endif %}>100</option>
                    <option value="0" {% if paginate_by == count %}selected{% endif %}>All</option>
                </select> entries
            </label>
            <input type="hidden" name="search" id="fsearch_id" value="{{search}}">
            <input type="hidden" name="fyear" id="fp" value="{{year}}">
            <input type="hidden" name="fmonth" id="fp" value="{{monthval}}">
        </form>
    </div>
    <div class="col-sm-12 col-md-4 col-lg-4 text-center">
        <h5 class="">
            {% if tb %}
                Total Balance of all Unsettled Bills : &#8369; {{tb.tots|floatformat:2|intcomma}}
            {% endif %}
            {% if bulky %}
                {{month}} {{year}}
            {% endif %}
        </h5>
    </div>
    <div class="col-sm-12 col-md-4 col-lg-4">
        <div id="table_filter" style="padding: 10px; float: right;" class="dataTables_filter">
            <label>
                <form class="input-group" action="" id="form" method="GET" role="form">
                    <div class="input-group-text">
                        <img style="width: 23px;" src="{% static 'search_FILL1_wght700_GRAD200_opsz48.svg' %}" />
                    </div>
                    <input  type="search" name="search" id="myInput" oninput="check()" class="form-control form-control-sm" placeholder="Search..." value="{{ search}}">
                    <input type="hidden" name="p" id="fp" value="{{paginate_by}}">
                    <input type="hidden" name="fyear" id="fp" value="{{year}}">
                    <input type="hidden" name="fmonth" id="fp" value="{{monthval}}">
                </form>
            
                <script>
                    fsearch = document.getElementById('fsearch_id');
                    fp = document.getElementById('fp');
                    yearselection = document.getElementById('yearselection');
                    selector = document.getElementById('selector');
                    var newURL = window.location.href.split("&search")
                    let myInput = document.getElementById('myInput');
                    form = document.getElementById('form')
                    function check() {
                        if (myInput.value == ''){
                            form.submit()
                        }
                    }
                    function change(){
                        if(newURL.length<=1){
                            yearselection.action = newURL[0] + "?p=" + selector.value
                        }else{
                            yearselection.action = newURL[0] + "&p=" + selector.value
                        }
                        yearselection.submit()
                    }
                    window.onload = function () {
                        var input = document.getElementById("myInput");
                        const end = input.value.length;
                        input.setSelectionRange(end, end);
                        input.focus();
                    }
                </script>
            </label>
        </div>
    </div>
</div>
