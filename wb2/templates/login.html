{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="{% static 'images/logo.png' %}" type="images/png" sizes="16x16">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    <link rel="stylesheet" type="text/css" href="{% static 'login.css'%}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <!-- CSS only -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    html {
        height: auto;
        min-height: 100%;
    }

    .message.op-0 {
        opacity: 0;
        transition: opacity 1s;
    }

    .button2 {
        background-color: #006c85;
        color: white;
        padding: 8px 30px;
        border: none;
        border-radius: 15px;
        box-shadow: inset 0px -8px 7px 0 rgb(0 0 0 / 24%), inset 0px 5px 7px 0 rgb(255 255 255 / 52%), 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease 0.3s;
    }
    .btn.button2:hover {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px -8px 7px 0 rgba(0, 0, 0, 0.39), inset 0px 5px 7px 0 #e6ecebd8, 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease-in 0.5s;
    }
    .btn.button2:focus {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px 4px 7px 0 rgba(0, 0, 0, 0.274), inset 0px -5px 7px 0 #e6ecebd8;
        transition: all 0.1s;
    }
    .fa-eye:before {
        content: "\f06e";
        padding: 0.5rem 0.75rem;
        margin-bottom: 0;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.25;
        color: #495057;
        text-align: center;
        background-color: #e9ecef;
        border: 1px solid rgba(0,0,0,.15);
        border-radius: 0.25rem;
        padding-bottom: 12px;
    }
    .fa-eye-slash:before {
        padding: 0.5rem 0.75rem;
        color: #495057;
        text-align: center;
        background-color: #e9ecef;
        border: 1px solid rgba(0,0,0,.15);
        border-radius: 0.25rem;
        padding-bottom: 12px;
    }
    @media (max-width: 350px) {
        h4 {
            font-size: 16px;
        }
    }

    @media (min-width: 351px) {
        h4 {
            font-size: 32px;
        }
    }

    @media (max-width: 350px) {
        h5 {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        h5 {
            font-size: 20px;
        }
    }

    @media only screen and (max-width: 350px) {
        .btn {
            width: 100;
        }
    }

    @media (max-width: 575px) {
        button.btn {
            font-size: 11px !important;
        }
    }

    @media (max-width: 350px) {
        ::placeholder {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        ::placeholder {
            font-size: 15px;
        }
    }
</style>

<body>
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div class="container">

            <div class="wrapper shadow"
                style=" margin: 10% auto !important; border-radius: 40px;  max-width: 400px; padding: 40px 0; background: #63CDD7;">
                <div class="log-in" style="padding-right: 15px">
                    <center>
                        <h4 style="color:white">Login</h4>
                        <h5 style="color:white">Enter User Credentials </h5>
                    </center>
                </div>
                <center>
                    <div class="form-group m-2 w-75">
                        <input type="username" name="username" class="form-control" placeholder="User ID">
                    </div>
                    <div class="row">
                        <div class="">
                            <form>
                                <div class="form-group m-2 w-75">
                                <div class="input-group" id="show_hide_password">
                                    <input class="form-control" type="password" placeholder="Password">
                                <div class="input-group-addon" style="margin-top: 5px;">
                                    <a href=""><i class="fa fa-eye-slash" aria-hidden="true"></i></a>
                                </div>
                                </div>
                                </div>
                            </form>
                        </div>
                    </div>
                     

                    <!-- <div class="form-group m-2 w-75">
                        <input type="password" name="password" style="border-radius: 20px;" class="form-control"
                            placeholder="Password">
                    </div> -->

                    <div class="button-container">
                        <button class="btn button2"><i class="fa fa-user-plus">
                            <span style="padding: 10px; font-family: Arial;">Sign In</span></i></button>
                    </div>
                    <br>
                    <div class="FP ">
                        <a href="{% url 'forgetpassword' %}" style="color: #006c85; font-size: 15px;">Forgot Password?</a>
                    </div>

                    {% for message in messages %}
                    <div id="logout"
                        class="message alert alert-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %} alert-dismissible"
                        style="margin-left: 70px; padding-left: 50px; position: absolute; border-radius: 10px; bottom: 400px;">
                        <strong>{{message.tags|title}}!</strong> {{message}}
                        <a href="#" class="close" data-dismiss="alert"
                        style="color: var(--bs-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %}); text-decoration: none;"
                        aria-label="close">&times;</a>
                    </div>
                    {% endfor %}
                </center>
            </div>
        </div>
    </form>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

</body>
<script>
    var logout = document.getElementById('logout');
    setTimeout(function closeModal() {
        logout.classList.add("op-0")
    }, 3000)
    setTimeout(function dispnone() {
        logout.style.display = "none"
    }, 4000)


    $(document).ready(function() {
    $("#show_hide_password a").on('click', function(event) {
        event.preventDefault();
        if($('#show_hide_password input').attr("type") == "text"){
            $('#show_hide_password input').attr('type', 'password');
            $('#show_hide_password i').addClass( "fa-eye-slash" );
            $('#show_hide_password i').removeClass( "fa-eye" );
        }else if($('#show_hide_password input').attr("type") == "password"){
            $('#show_hide_password input').attr('type', 'text');
            $('#show_hide_password i').removeClass( "fa-eye-slash" );
            $('#show_hide_password i').addClass( "fa-eye" );
        }
    });
});
</script>

</html>
