<!--{% load static %}-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'login.css'%}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

</head>
<style>
    html{
        height:auto;
        min-height: 100%;
    }
    @media (max-width: 350px){
        h4 { font-size: 16px;}
    }
    @media (min-width: 351px){
        h4 { font-size: 32px;}
    }

    @media (max-width: 350px){
        h5 { font-size: 10px;}
    }
    @media (min-width: 351px){
        h5 { font-size: 20px;}
    }

    @media only screen and (max-width: 350px){
        .btn{
            width: 100;     
           }    
    }

    @media (max-width: 575px){
        button.btn{
          font-size: 11px !important;
        }
      }

     @media (max-width: 350px){
        ::placeholder {font-size: 10px;}
      }

      @media (min-width: 351px){
        ::placeholder {font-size: 15px; }
      }


</style>
<body>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="container">

            <div class="wrapper shadow"
                style=" margin: 10% auto !important; border-radius: 40px;  max-width: 440px; padding: 40px 0; background: #63CDD7;">
                <div class="log-in" style="padding-right: 15px">
                    <center>
                        <h4 style="color:white">Login</h4>
                        <h5 style="color:white">Enter User Credentials </h5>
                    </center>
                </div>
                <center>
                    <div class="form-group m-2 w-75">
                        <input type="username" name="username" style="border-radius: 20px;" class="form-control" placeholder="Email Address">
                    </div>

                    <div class="form-group m-2 w-75">
                        <input type="password" name="password" style="border-radius: 20px;" class="form-control" placeholder="Password">
                    </div>

                    <div class="button-container">
                        <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 75%;"
                            type="submit" class="btn">Sign In</button style>



                    </div>
                    <div class="FP ">
                        <a href="{% url 'forgetpassword'%}" style="color: #0093B7; font-size: 15px;">Forgot Password?</a>
                    </div>



                    
                    


                    {% for message in messages %}
                    <div class="alert alert-{% if message.tags == "error" %}danger{% else %}{{message.tags}}{% endif %} alert-dismissible">
                        <strong>{{message.tags|title}}!</strong> {{message}}
                        <a href="#" class="close" data-dismiss="alert" style="color: var(--bs-{% if message.tags == "error" %}danger{% else %}{{message.tags}}{% endif %}); text-decoration: none;") aria-label="close">&times;</a>
                    </div>
                    {% endfor %}
                </center>
            </div>
        </div>
    </form>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</body>
</html>
