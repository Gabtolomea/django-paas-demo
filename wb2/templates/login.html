{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="{% static 'images/logo.png' %}" type="images/png" sizes="16x16">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    <link rel="stylesheet" type="text/css" href="{% static 'login.css'%}" />
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}"/>

    

</head>
<style> 
    html {
        height: auto;
        min-height: 100%;
    }

    .message.op-0 {
        opacity: 0;
        transition: opacity 1s;
    }

    .button2 {
        background-color: #006c85;
        color: white;
        padding: 8px 30px;
        border: none;
        border-radius: 15px;
        box-shadow: inset 0px -8px 7px 0 rgb(0 0 0 / 24%), inset 0px 5px 7px 0 rgb(255 255 255 / 52%), 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease 0.3s;
    }
    .btn.button2:hover {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px -8px 7px 0 rgba(0, 0, 0, 0.39), inset 0px 5px 7px 0 #e6ecebd8, 0px 6px 6px 0 rgb(0 0 0 / 19%);
        transition: all ease-in 0.5s;
    }
    .btn.button2:focus {
        background: #006c85;
        color: #ffffff;
        border-radius: 30px;
        box-shadow: inset 0px 4px 7px 0 rgba(0, 0, 0, 0.274), inset 0px -5px 7px 0 #e6ecebd8;
        transition: all 0.1s;
    }

    @media (max-width: 350px) {
        h4 {
            font-size: 16px;
        }
    }

    @media (min-width: 351px) {
        h4 {
            font-size: 32px;
        }
    }

    @media (max-width: 350px) {
        h5 {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        h5 {
            font-size: 20px;
        }
    }

    @media only screen and (max-width: 350px) {
        .btn {
            width: 100;
        }
    }

    @media (max-width: 575px) {
        button.btn {
            font-size: 11px !important;
        }
    }

    @media (max-width: 350px) {
        ::placeholder {
            font-size: 10px;
        }
    }

    @media (min-width: 351px) {
        ::placeholder {
            font-size: 15px;
        }
    }
</style>

<body>
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div class="container">

            <div class="wrapper shadow"
                style=" margin: 10% auto !important; border-radius: 40px;  max-width: 400px; padding: 40px 0; background: #63CDD7;">
                <div class="log-in" style="padding-right: 15px">
                    <center>
                        <h4 style="color:white">Login</h4>
                        <h5 style="color:white">Enter User Credentials </h5>
                    </center>
                </div>
                <center>
                    <div class="form-group m-2 w-75">
                        <input type="username" name="username" style="border-radius: 20px;" class="form-control" placeholder="User ID">
                    </div>

                    <div class="form-group m-2 w-75">
                        <div class="input-group" id="show_hide_password" onclick="showhide('id_password2')">
                            <input class="form-control" type="password" name="password" >
                            <div class="input-group-text" style="cursor: pointer;" >
                                <img style="width: 20px;" id="id_password2_eye"
                                src="{% static '/images/eye-off.svg' %}">
                        
                            </div>
                    </div>

                    <div class="button-container">
                        <button class="btn button2"><i class="fa fa-user-plus">
                            <span style="padding: 10px; font-family: Arial;">Sign In</span></i></button>
                    </div>
                    <br>
                    <div class="FP ">
                        <a href="{% url 'forgetpassword' %}" style="color: #0093B7; font-size: 15px;">Forgot Password?</a>
                    </div>

                    {% for message in messages %}
                    <div id="logout"
                        class="message alert alert-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %} alert-dismissible"
                        style="margin-left: 70px; padding-left: 50px; position: absolute; border-radius: 10px; bottom: 400px;">
                        <strong>{{message.tags|title}}!</strong> {{message}}
                        <a href="#" class="close" data-dismiss="alert"
                        style="color: var(--bs-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %}); text-decoration: none;"
                        aria-label="close">&times;</a>
                    </div>
                    {% endfor %}
                </center>
            </div>
        </div>
    </form>
    <script src="{% static 'jquery/jquery.js' %}"></script>
    <script src="{% static 'popper.min.js' %}"></script>

</body>
<script>
    var logout = document.getElementById('logout');
    setTimeout(function closeModal() {
        logout.classList.add("op-0")
    }, 3000)
    setTimeout(function dispnone() {
        logout.style.display = "none"
    }, 4000)
</script>
<script>
    function showhide(id) {
        pass = document.getElementById(id)
        eye = document.getElementById(id + "_eye")
        console.log(pass);
        if (pass.type === "text") {
            pass.type = 'password'
            eye.src = "{% static '/images/eye-off.svg' %}"

        } else {
            pass.type = 'text'
            eye.src = "{% static '/images/eye-on.svg' %}"

        }
    }
</script>

</html>
