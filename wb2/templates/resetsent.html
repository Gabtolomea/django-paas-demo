{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Verification</title>

    <link rel="stylesheet" type="text/css" href="{% static 'resetsent.css'%}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

</head>

    <style>

        html{
            background-image: linear-gradient(white,#63CDD7);
            height: 100%;
            font-family: 'Poppins',sans-serif;
          }
          body{
            margin: 10%;
            background: transparent!important;
            background-color: #63CDD7;
            height: 450px;
          }
          
          .meter{
            margin: 25px 0 0 0;
            width: 100%;
            height: 50px;
            color: rgb(238, 226, 226);
            font-size: 18px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.438);
            border-radius: 8px;
            background: rgba(105, 105, 105, 0);
            margin-top: 40px;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
          }
          
          .FP{
            text-align: right;
            padding-right: 60px;
            
          }
          .button{
            background-color: #0093B7;
            color:white;
            border-radius:25px;
            width:100%;
            height: 40px;
            margin-top: 10px;
            border-color: #63CDD7;
            margin-top: 20px;
          }
          .header{
            margin-top: 20px;
            color: #fff;
            margin-bottom: 60px;
            padding-left: 10%;
            padding-right: 10%
          }
          
    </style>
<body>
    <div class="container">
        <div class="wrapper shadow" style=" margin: 10% auto !important; border-radius: 30px;  max-width: 600px; max-height: 500px; padding: 40px 0; background: #63CDD7; height:400px;">
            <div class="log-in" style="padding-right: 15px">
                <center>
                  <h5 class="password" style="font-size: 30px;  color:white; font-family:'Poppins',sans-serif;">Reset Password Sent</h5>
                </center>
                <br>
            </div>
            <center>
                <p class="header">We sent you an email in response to your request,please check it and click the 'Back to login' button to coninue.</p>
                    
                <div class="form-group m-2 w-75"   > 
                    <a href="/reset_password">
                    <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 75%; margin-bottom: 20px;" type="button" class="btn ">RESEND EMAIL</button style>
                    </a>
                    <a href="/">
                    <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 75%;" type="button" class="btn ">BACK TO LOGIN</button style>
                    </a>
                    </div>
                   
            </center>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>

</body>
</html>
