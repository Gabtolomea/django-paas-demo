<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Verification</title>

    <link rel="stylesheet" type="text/css" href="{% static 'resetsent.css'%}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">


</head>

<style>
	html {
		background-image: linear-gradient(white, #63CDD7);
		height: 100%;
		font-family: 'Poppins', sans-serif;
	}

	body {
		margin: 10%;
		background: transparent !important;
		background-color: #63CDD7;
		height: 450px;
	}

	.meter {
		margin: 25px 0 0 0;
		width: 100%;
		height: 50px;
		color: rgb(238, 226, 226);
		font-size: 18px;
		font-weight: 600;
		border: 2px solid rgba(255, 255, 255, 0.438);
		border-radius: 8px;
		background: rgba(105, 105, 105, 0);
		margin-top: 40px;
		outline: none;
		cursor: pointer;
		border-radius: 8px;
	}

	.FP {
		text-align: right;
		padding-right: 60px;

	}

	.button {
		background-color: #0093B7;
		color: white;
		border-radius: 25px;
		width: 100%;
		height: 40px;
		margin-top: 10px;
		border-color: #63CDD7;
		margin-top: 20px;
	}

  @media (max-width: 600px){
    h5 { font-size: 16px;}
  }
  @media (min-width: 601px){
    h5 { font-size: 32px;}
  }

  @media (max-width: 600px){
    p { font-size: 10px;}
  }
  @media (min-width: 601px){
    p { font-size: 20px;}
  }

  @media (max-width: 575px){
	button.btn{
	  font-size: 11px !important;
	}
  }

</style>


    </style>
<body>
    <div class="container">
        <div class="wrapper shadow" style=" margin: 10% auto !important; border-radius: 30px;  max-width: 500px; max-height: 600px; padding: 40px 0; background: #63CDD7; height:400px;">
            <div class="log-in" style="padding-right: 15px">
                <center>
                  <h5 style="color:white; font-family:'Poppins',sans-serif;">Reset Password Sent</h5>
                </center>
                <br>
            </div>
            <center>
                <p style="margin-top: 10px; color: white; margin-bottom: 60px; padding-left: 10%; padding-right: 10%; font-size:15px;">We sent you an email in response to your request,please check it and click the 'Back to login' button to coninue.</p>

                <div class="form-group m-2 w-75"   >
                    <a href="/reset_password">
                    <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 75%; margin-bottom: 20px; transition: all 0.2s; white-space: nowrap; margin-top: 10px;" type="button" class="btn ">Resend Email</button style>
                    </a>
                    <a href="/">
                    <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 75%; white-space: nowrap;" type="button" class="btn ">Back to Login</button style>
                    </a>
                    </div>

            </center>


		</div>

	</div>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
		crossorigin="anonymous"></script>

</body>

</html>
