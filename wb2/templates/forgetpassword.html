{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" type="text/css" href="{% static 'forgotpassword.css'%}" />
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
	<style>
		.meter {
			margin: 25px 0 0 0;
			width: 100%;
			height: 50px;
			color: rgb(238, 226, 226);
			font-size: 18px;
			font-weight: 600;
			border: 2px solid rgba(255, 255, 255, 0.438);
			border-radius: 8px;
			background: rgba(105, 105, 105, 0);
			margin-top: 40px;
			outline: none;
			cursor: pointer;
			border-radius: 8px;
		}
	
		.FP {
			text-align: right;
			padding-right: 60px;
	
		}
	
		.password {
			font-family: 'Poppins', sans-serif;
			font-weight: 500;
			font-size: 27px;
		}
	
		.reminder {
			font-family: 'Poppins', sans-serif;
			margin-top: 20px;
			text-align: center;
			color: white;
			font-size: medium;
			padding-left: 10%;
			padding-right: 10%;
	
		}
	
		.container {
			padding: 0 10px;
		}
	
		@media (max-width: 350px) {
			h1 {
				font-size: 16px;
			}
		}
	
		@media (min-width: 351px) {
			h1 {
				font-size: 32px;
			}
		}
	
		@media (max-width: 350px) {
			p {
				font-size: 10px;
			}
		}
	
		@media (min-width: 351px) {
			p {
				font-size: 15px;
			}
		}
	
		@media (max-width: 575px) {
			button.btn {
				font-size: 11px !important;
			}
		}
	
		@media (max-width: 350px) {
			::placeholder {
				font-size: 10px;
			}
		}
	
		@media (min-width: 351px) {
			::placeholder {
				font-size: 15px;
			}
		}
	</style>
	
</head>

<body>
	<div class="container">
		<div class="wrapper shadow"
			style=" margin: 10% auto !important; border-radius: 30px;  max-width: 370px; padding: 40px 0; background: #0093b7; height:375px;">
			<div class="log-in" style="padding-right: 15px">
				
			</div>
				<form action="forgetpassword" method="POST">
					{% csrf_token %}
					<p
						style="font-family: 'Poppins',sans-serif; text-align: center; color: white; padding-left: 10%;padding-right: 10%;">
						Please enter your email and select "Reset Password" to continue.</p>
					<div class="form-group m-2 w-75">
						<input type="text" name="email"
							style="border-radius: 25px; width: 100%; margin-top: 10%; height: 40px; font-size: 15px;"
							class="form-control" placeholder="Email Address">
					</div>

					<div class="form-group m-2 w-75">
						<button
							style="background-color:#0093B7; color:white;  border-radius:25px; width: 100%; margin-top: 2%; height: 40px; font-size: 15px;"
							type="submit" class="btn ">Reset Password</button>
					</div>
					<div class="form-group m-2 w-75">
						<button
							style="background-color:#0093B7; color:white;  border-radius:25px; width: 100%; margin-top: 1%; height: 40px; font-size: 15px;"
							type="submit" class="btn ">BACK</button>
					</div>
				</form>
		</div>
	</div>
    <script src="{% static 'bootstrap.min.js' %}"></script>
</body>

</html>
