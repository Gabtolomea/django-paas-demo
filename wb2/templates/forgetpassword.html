{% load static %}
<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(white, #0093b7);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }


        .forgot-card {
            width: 100%;
            max-width: 460px;
            background: linear-gradient(135deg, #0093B7, #006c85);
            color: #fff;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }


        .forgot-card h4,
        .forgot-card h6 {
            color: #fff;
        }


        .form-control {
            border-radius: 12px;
            border: 1px solid #bbb;
            padding: 14px 18px;
            font-size: 16px;
            transition: 0.3s ease;
        }


        .form-control:focus {
            border-color: #0093B7;
            box-shadow: 0 0 10px rgba(0, 147, 183, 0.35);
        }


        /* Button */
        .btn-reset {
            background: linear-gradient(135deg, #00C6E0, #00A6C2);
            color: #fff;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            width: 80%;
            margin-top: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }


        .btn-reset:hover {
            background: linear-gradient(135deg, #00D2F0, #0093B7);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
             color: #222020ff;
        }


       


        .btn-reset:active {
            transform: scale(0.96);
        }


        .back-link {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #fafdfdff;
            text-decoration: none;
            transition: 0.3s;
        }


        .back-link:hover {
            color: #13afd6ff;
            text-decoration: underline;
        }


        .message {
            transition: opacity 0.8s ease, transform 0.5s ease;
            border-radius: 8px;
            font-size: 14px;
        }


        .message.op-0 {
            opacity: 0;
            transform: translateY(-15px);
        }


        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>


<body>
    <form action="{% url 'forgetpassword' %}" method="POST">
        {% csrf_token %}
        <div class="forgot-card">
            <img src="{% static 'images/logo.png' %}" alt="System Logo" style="width:60px; margin-bottom:15px;">
            <h4>Forgot Password</h4>
            <h6 style= "margin-top: 10px;">Please enter your email and select "Reset Password" to continue.</h6>


            <div class="form-group mb-3 mt-4">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>


            <button type="submit" class="btn-reset">
                Reset Password
            </button>


            <a href="{% url 'login' %}" class="back-link">Back to Login</a>


            {% for message in messages %}
            <div id="alertmsg"
                class="message alert alert-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %} mt-3">
                <strong>{{message.tags|title}}!</strong> {{message}}
                <a href="#" class="close" data-dismiss="alert" style="text-decoration:none;">&times;</a>
            </div>
            {% endfor %}
        </div>
    </form>


    <script>
        var msg = document.getElementById('alertmsg');
        if (msg) {
            setTimeout(function () {
                msg.classList.add("op-0");
            }, 3000);
            setTimeout(function () {
                msg.style.display = "none";
            }, 4000);
        }
    </script>
</body>
</html>
