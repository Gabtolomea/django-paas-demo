{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" type="text/css" href="{% static 'forgotpassword.css'%}" />
    <link rel="stylesheet" href="{% static 'bootstrap.min.css' %}">
	<style>
		.meter {
			margin: 25px 0 0 0;
			width: 100%;
			height: 50px;
			color: rgb(238, 226, 226);
			font-size: 18px;
			font-weight: 600;
			border: 2px solid rgba(255, 255, 255, 0.438);
			border-radius: 8px;
			background: rgba(105, 105, 105, 0);
			margin-top: 40px;
			outline: none;
			cursor: pointer;
			border-radius: 8px;
		}
	
		.FP {
			text-align: right;
			padding-right: 60px;
	
		}
	
		.password {
			font-family: 'Poppins', sans-serif;
			font-weight: 500;
			font-size: 27px;
		}
	
		.reminder {
			font-family: 'Poppins', sans-serif;
			margin-top: 20px;
			text-align: center;
			color: white;
			font-size: medium;
			padding-left: 10%;
			padding-right: 10%;
	
		}
	
		.container {
			padding: 0 10px;
		}
	
		@media (max-width: 350px) {
			h1 {
				font-size: 16px;
			}
		}
	
		@media (min-width: 351px) {
			h1 {
				font-size: 32px;
			}
		}
	
		@media (max-width: 350px) {
			p {
				font-size: 10px;
			}
		}
	
		@media (min-width: 351px) {
			p {
				font-size: 15px;
			}
		}
	
		@media (max-width: 575px) {
			button.btn {
				font-size: 11px !important;
			}
		}
	
		@media (max-width: 350px) {
			::placeholder {
				font-size: 10px;
			}
		}
	
		@media (min-width: 351px) {
			::placeholder {
				font-size: 15px;
			}
		}
	</style>
	
</head>

<style>
	html {
		background-image: linear-gradient(white, #0093b7);
		height: 100%;
		font-family: 'Poppins', sans-serif;
	}

	body {
		margin: 10%;
		background: transparent !important;
		background-color: #0093b7;
		height: 450px;
	}

	.meter {
		margin: 25px 0 0 0;
		width: 100%;
		height: 50px;
		color: rgb(238, 226, 226);
		font-size: 18px;
		font-weight: 600;
		border: 2px solid rgba(255, 255, 255, 0.438);
		border-radius: 8px;
		background: rgba(105, 105, 105, 0);
		margin-top: 40px;
		outline: none;
		cursor: pointer;
		border-radius: 8px;
	}

	.FP {
		text-align: right;
		padding-right: 60px;

	}

	.password {
		font-family: 'Poppins', sans-serif;
		font-weight: 500;
		font-size: 27px;
	}

	.reminder {
		font-family: 'Poppins', sans-serif;
		margin-top: 20px;
		text-align: center;
		color: white;
		font-size: medium;
		padding-left: 10%;
		padding-right: 10%;

	}

	.container {
		padding: 0 10px;
	}
	.btn{
    background-color: #0cb3c2;
    color: #ffffff;
    padding: 8px 30px;
    border-radius: 15px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    transition-duration: 0.4s;
    cursor: pointer;
	box-shadow: inset 0px -8px 7px 0 rgb(0 0 0 / 24%), inset 0px 5px 7px 0 rgb(255 255 255 / 52%), 0px 6px 6px 0 rgb(0 0 0 / 19%);
    transition: all ease 0.3s;
    }
    .btn:first-child:hover, :not(.btn-check)+.btn:hover{
    background-color:white !important;
    color:black;
    }



	@media (max-width: 350px) {
		h1 {
			font-size: 16px;
		}
	}

	@media (min-width: 351px) {
		h1 {
			font-size: 32px;
		}
	}

	@media (max-width: 350px) {
		p {
			font-size: 10px;
		}
	}

	@media (min-width: 351px) {
		p {
			font-size: 15px;
		}
	}

	@media (max-width: 575px) {
		button.btn {
			font-size: 11px !important;
		}
	}

	@media (max-width: 350px) {
		::placeholder {
			font-size: 10px;
		}
	}

	@media (min-width: 351px) {
		::placeholder {
			font-size: 15px;
		}
	}
</style>

<body>
	<div class="container">
		<div class="wrapper shadow"
			style=" margin: 10% auto !important; border-radius: 30px;  max-width: 370px; padding: 35px 0; background: #0093b7; height:336px;">
			<div class="log-in" style="padding-right: 15px">
				
			</div>
				<form action="forgetpassword" method="POST">
					{% csrf_token %}
					<p
						style="font-family: 'Poppins',sans-serif; text-align: center; color: white; padding-left: 10%;padding-right: 10%;">
						Please enter your email and select "Reset Password" to continue.</p>
					<div class="form-group m-2 w-75">
						<input type="text" name="email"
							style="background-color: white; border-radius: 25px; width: 100%; margin-top: 10%;margin-left: 35px; height: 40px; font-size: 15px;"
							class="form-control" placeholder="Email Address">
					</div>
				
					<div class="form-group m-2 w-70">
						<center class="pb-2"><button type="submit" id="footer-subscription-button" class="btn submit" >Reset Password</button></center>

						<div class="FP ">
							<a href="{% url 'login' %}" style="color: #63CDD7; font-size: 18px; margin-right: 100px;">Back</a>
						</div>
					</div>
				</form>
			</center>
		</div>
		{% for message in messages %}
		<div id="" class="message alert alert-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %} alert-dismissible"
			style="margin-left: 70px; padding-left: 50px; position: absolute; border-radius: 10px; bottom: 400px;">
			<strong>{{message.tags|title}}!</strong> {{message}}
			<a href="#" class="close" data-dismiss="alert" style="color: var(--bs-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %}); text-decoration: none;"
			aria-label="close">&times;</a>
		</div>
		{% endfor %}
	</div>
    <script src="{% static 'bootstrap.min.js' %}"></script>
</body>

</html>
