
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" type="text/css" href="{% static 'forgotpassword.css'%}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
</head>

    <style>
        html{
            background-image: linear-gradient(white,#63CDD7);
            height: 100%;
            font-family: 'Poppins',sans-serif;
          }
          body{
            margin: 10%;
            background: transparent!important;
            background-color: #63CDD7;
            height: 450px;
          }
          .meter{ 
            margin: 25px 0 0 0;
            width: 100%;
            height: 50px;
            color: rgb(238, 226, 226);
            font-size: 18px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.438);
            border-radius: 8px;
            background: rgba(105, 105, 105, 0);
            margin-top: 40px;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
          }

          .FP{
            text-align: right;
            padding-right: 60px;

          }
          .password{
            font-family: 'Poppins',sans-serif;
            font-weight: 500;
          }
          .reminder{
            font-family: 'Poppins',sans-serif;
            margin-top: 20px;
            text-align: center;
            color: white;
            font-size: medium;
            padding-left: 10%;
            padding-right: 10%;

          }
          .header{
            font-family: 'Poppins',sans-serif;
            text-align: center;
            font-size: 15px;
            color: white;
            padding-left: 10%;
            padding-right: 10%;
          }
          .container{
            padding: 0 10px;
          }
          .password{
            font-size: 25px;
            font-weight: normal;
            color: white;
          }
          .btn{
            font-size: 13px;
          }

    </style>
<body>
    <div class="container">
        <div class="wrapper shadow" style=" margin: 10% auto !important; border-radius: 30px;  max-width: 400px; padding: 40px 0; background: #63CDD7; height:450px;">
            <div class="log-in" style="padding-right: 15px">
                <center>
                  <p class="password">Reset  Password</p>
                </center>
                <br>
            </div>
            <center>
                {% for message in messages %}
                <div class="alert alert-{{message.tags}} alert-dismissable fade show" role="alertdialog">{{message}}</div>
                {% endfor %}
                <form action="forgetpassword" method="POST">
                {% csrf_token %}
                <p class="header">Please enter your email and select "RESET PASSWORD" to continue.</p>
                    <div class="form-group m-2 w-75">
                        <input type="text" name="email" style="border-radius: 25px width: 75%;" class="form-control" placeholder="Email Address">
                    </div>
                    <div class="form-group m-2 w-75"   >
                        <button style="background-color:#0093B7; color:white;  border-radius:25px; width: 80%; margin-top: 5%" type="submit" class="btn ">RESET PASSWORD</button style>
                    </div>
                </form>
            </center>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
</body>
</html>
