{% load humanize %}


<!DOCTYPE html>
<html lang="en">

<head>
   
    <title>Add New Consumer Type</title>
</head>

<body>
    <form method='post'>
        {% csrf_token %}
        <h1> Add New Consumer Type</h1>
        <label>New Consumer Type:</label>
        {{form.contype}}
        <br>
        <br>
        <label>New Minimum Water Reading:</label>
        {{form.minReading}}
        <br>
        <br>
        <label>New Minimum Water Reading Charge:</label>
        {{form.minReadingCharge}}
        <br>
        <br>
        <label>New Rate After Minimum Reading:</label>
        {{form.rateAfterMin}}
        <br>
        <br>
        <label>Added by (System Username):</label>
        {{form.added_by}}

        <br>
        <br>

        <input type="submit" name="Submit">

    </form>

</body>

</html>
