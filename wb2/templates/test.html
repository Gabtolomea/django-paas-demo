
<style>
    .chartBox{
        width: 600px;
        padding: 20px;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>


<div class ="chartBox"></div>
<canvas id="myChart" ></canvas>
</div>

<div class ="selectBox">
    <select id ="coffeesales">
   
  <option value="'{{test.jan}}', '{{test.feb}}', '{{test.mar}}', '{{test.apr}}', '{{test.may}}', '{{test.jun}}', '{{test.jul}}', '{{test.aug}}', '{{test.sept}}', '{{test.oct}}', '{{test.nov}}', '{{test.dec}}'">Bitch</option>

    </select>

</div>

<script>
    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
            datasets: [{
                label: '# of Votes',
                data: ['{{test.jan}}', '{{test.feb}}', '{{test.mar}}', '{{test.apr}}', '{{test.may}}', '{{test.jun}}', '{{test.jul}}', '{{test.aug}}', '{{test.sept}}', '{{test.oct}}', '{{test.nov}}', '{{test.dec}}'],
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
    const coffeesales = document.getElementById('coffeesales');
    coffeesales.addEventListener('change', salesTracker);
    function salesTracker(){
        const label = coffeesales.options[coffeesales.selectedIndex].text;
        myChart.data.datasets[0].label = label;
        myChart.data.datasets[0].data = coffeesales.value.split(',');
        
        myChart.update()
    }

    </script>
